name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: agent-sh/.github/.github/workflows/ci-node.yml@ecb3c8c0c8bdad8308ba68462d98cbcca1ccaa93
    secrets: inherit

  agnix:
    uses: agent-sh/.github/.github/workflows/ci-agnix.yml@ecb3c8c0c8bdad8308ba68462d98cbcca1ccaa93

  windows-shim:
    name: Windows shim argument conformance
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: node --test tests/windows-shim-conformance.cjs tests/authorized-execution.cjs
